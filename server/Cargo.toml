[package]
name = "server"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
tower-http = { version = "0.6", features = ["trace"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# parser-core is added at stage S4 (job queue); S1 does not parse anything yet

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
