[package]
name = "parser-core"
version = "0.1.0"
edition = "2021"

[dependencies]
# demoparser2 core; pinned to a commit because the crate is not published on crates.io
parser = { git = "https://github.com/LaihoE/demoparser", rev = "ea9a82bff5118d97de64d9384837294e210e5739" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
memmap2 = "0.9"
ahash = "0.8"

[dev-dependencies]
# reference JSON in samples/ is stored gzipped
flate2 = "1"
